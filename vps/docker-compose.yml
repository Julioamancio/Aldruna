name: aldruna

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${CANARY_DB_NAME}"
      MARIADB_USER: "${CANARY_DB_USER}"
      MARIADB_PASSWORD: "${CANARY_DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${CANARY_DB_ROOT_PASSWORD}"
    networks: [aldruna-net]
    volumes:
      - db-volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    # Imagem propria com o binario OFICIAL v3.6.1 (protocolo 15.11, igual ao
    # cliente e ao servidor local do PC). NAO voltar para a imagem
    # ghcr.io/opentibiabr/canary:3.6.1 - a tag mente, fala 15.25.
    # serverName (config.lua do server/) TEM que ser igual ao ALDRUNA_WORLD_NAME.
    build: ./server
    restart: unless-stopped
    environment:
      CANARY_DB_HOST: db
      CANARY_DB_NAME: "${CANARY_DB_NAME}"
      CANARY_DB_USER: "${CANARY_DB_USER}"
      CANARY_DB_PASSWORD: "${CANARY_DB_PASSWORD}"
      CANARY_PUBLIC_IP: "${PUBLIC_IP}"
    networks: [aldruna-net]
    ports:
      - "7171:7171"
      - "7172:7172"
    depends_on:
      db:
        condition: service_healthy

  login:
    build: ./login
    restart: unless-stopped
    environment:
      ALDRUNA_LISTEN_HOST: "0.0.0.0"
      ALDRUNA_LISTEN_PORT: "8081"
      ALDRUNA_GAME_IP: "${PUBLIC_IP}"
      ALDRUNA_GAME_PORT: "7172"
      ALDRUNA_WORLD_NAME: "${WORLD_NAME}"
      ALDRUNA_DB_HOST: db
      ALDRUNA_DB_PORT: "3306"
      ALDRUNA_DB_NAME: "${CANARY_DB_NAME}"
      ALDRUNA_DB_USER: "${CANARY_DB_USER}"
      ALDRUNA_DB_PASSWORD: "${CANARY_DB_PASSWORD}"
    networks: [aldruna-net]
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-volume:
  server-data:

networks:
  aldruna-net:
    driver: bridge

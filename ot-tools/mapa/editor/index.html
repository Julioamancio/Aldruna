<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editor de Mapas — Destruitor</title>
<style>
  :root {
    --fundo: #17181c; --painel: #1f2128; --borda: #2e3138;
    --texto: #d8dae0; --fraco: #8b8f9a; --destaque: #6fae4a; --alerta: #d98a3a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; font: 13px/1.4 system-ui, sans-serif;
         background: var(--fundo); color: var(--texto);
         grid-template-columns: 268px 1fr 190px; grid-template-rows: 44px 1fr 26px;
         grid-template-areas: "topo topo topo" "paleta tela lados" "rodape rodape rodape"; }

  header { grid-area: topo; display: flex; align-items: center; gap: 8px;
           padding: 0 10px; background: var(--painel); border-bottom: 1px solid var(--borda); }
  header b { color: var(--destaque); margin-right: 6px; }
  button { background: #2a2d35; color: var(--texto); border: 1px solid var(--borda);
           border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  button:hover { background: #343842; }
  button.ativo { background: var(--destaque); color: #10210a; border-color: var(--destaque); }
  button:disabled { opacity: .45; cursor: default; }

  #paleta { grid-area: paleta; background: var(--painel); border-right: 1px solid var(--borda);
            display: flex; flex-direction: column; overflow: hidden; }
  #categoria { margin: 0 8px 8px; padding: 4px 6px; background: #14151a;
               color: var(--texto); border: 1px solid var(--borda); border-radius: 5px; }
  #busca { margin: 8px; padding: 5px 7px; background: #14151a; color: var(--texto);
           border: 1px solid var(--borda); border-radius: 5px; }
  #abas { display: flex; gap: 4px; padding: 0 8px 6px; }
  #abas button { flex: 1; padding: 4px; }
  /* a coluna acompanha o tamanho escolhido; com a celula quadrada, e a
     LARGURA que precisa mudar - limitar a altura anulava a proporcao e o tile
     voltava a aparecer achatado */
  #pecas { flex: 1; overflow-y: auto; padding: 0 8px 8px; display: flex;
           flex-wrap: wrap; gap: 6px; align-content: start; }
  .peca { background: #101116; border: 1px solid var(--borda); border-radius: 4px;
          cursor: pointer; overflow: hidden; }
  /* O tamanho vai em PIXEL, escrito na propria tag da imagem. Depender de
     porcentagem, aspect-ratio ou da coluna do grid ja falhou tres vezes: em
     telas diferentes o container achatava o tile. Pixel fixo nenhum layout
     estica. */
  .peca img { display: block; image-rendering: pixelated; background: #0b0c10; }
  .peca span { display: block; font-size: 10px; line-height: 1.25; padding: 3px 4px;
               color: var(--fraco); white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; }
  .peca.sel { border-color: var(--destaque); box-shadow: 0 0 0 1px var(--destaque); }

  /* previa grande: escolher textura por miniatura pequena e chute; aqui da
     para ver a peca inteira antes de pintar */
  #previa { position: fixed; z-index: 20; display: none; pointer-events: none;
            background: #101116; border: 1px solid var(--destaque); border-radius: 6px;
            padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
  /* 256 = 32 x 8: multiplo exato do tile, entao cada pixel vira um quadrado
     de 8 e nao aparece borrao nem meia-linha */
  #previa img { display: block; width: 256px; height: 256px; object-fit: contain;
                image-rendering: pixelated; background: #0b0c10; }
  #previa span { display: block; margin-top: 4px; font-size: 11px; color: var(--texto);
                 text-align: center; }
  #tela { grid-area: tela; position: relative; overflow: hidden; background: #0c0d10; }
  canvas { position: absolute; inset: 0; image-rendering: pixelated; cursor: crosshair; }

  aside { grid-area: lados; background: var(--painel); border-left: 1px solid var(--borda);
          padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  aside h3 { margin: 0; font-size: 11px; text-transform: uppercase; color: var(--fraco);
             letter-spacing: .06em; }
  .linha { display: flex; gap: 4px; flex-wrap: wrap; }
  .linha button { flex: 1; min-width: 40px; }
  label { font-size: 12px; color: var(--fraco); display: flex; justify-content: space-between; }

  footer { grid-area: rodape; display: flex; align-items: center; gap: 14px; padding: 0 10px;
           background: var(--painel); border-top: 1px solid var(--borda);
           font-size: 11px; color: var(--fraco); }
  #recado { color: var(--texto); }
  #recado.erro { color: #e06c5a; }
  #recado.ok { color: var(--destaque); }
</style>
</head>
<body>

<header>
  <b>Destruitor</b><span style="color:#8b8f9a;font-size:11px">v13</span>
  <span id="modo" style="font-size:11px;font-weight:600;padding:3px 8px;
        border-radius:4px;background:#3a3d45;color:#8b8f9a">...</span>
  <button id="btSalvar">Salvar e publicar</button>
  <button id="btDesfazer" title="Ctrl+Z">Desfazer</button>
  <button id="btRefazer" title="Ctrl+Y">Refazer</button>
  <span style="flex:1"></span>
  <label style="gap:6px"><input type="checkbox" id="verGrade" checked> grade</label>
  <button id="btCentrar">Centralizar</button>
  <span style="color:#8b8f9a;font-size:11px">botão direito = pegar peça</span>
</header>

<div id="paleta">
  <input id="busca" placeholder="buscar peça...">
  <div id="abas">
    <button data-amb="todos" class="ativo">Todos</button>
    <button data-amb="exterior">Exterior</button>
    <button data-amb="interior">Interior</button>
  </div>
  <select id="categoria"><option value="">todas as categorias</option></select>
  <label style="padding:0 8px 6px; gap:6px">
    tamanho <input type="range" id="zoomPaleta" min="64" max="192" step="32" value="96"
                   style="flex:1">
  </label>
  <div id="pecas"></div>
</div>

<div id="previa"><img id="previaImg" alt=""><span id="previaNome"></span></div>
<div id="tela"><canvas id="cv"></canvas></div>

<aside>
  <h3>Ferramenta</h3>
  <div class="linha">
    <button data-fer="pincel" class="ativo">Pincel</button>
    <button data-fer="balde">Balde</button>
  </div>
  <div class="linha">
    <button data-fer="borracha">Borracha</button>
    <button data-fer="conta">Conta-gotas</button>
  </div>

  <h3>Pincel</h3>
  <label>tamanho <span id="vTam">1</span></label>
  <input type="range" id="tamanho" min="1" max="10" step="1" value="1">
  <div class="linha">
    <button data-forma="quadrado" class="ativo">Quadrado</button>
    <button data-forma="circulo">Círculo</button>
  </div>

  <h3>Camada</h3>
  <div class="linha">
    <button data-camada="chao" class="ativo">Chão</button>
    <button data-camada="itens">Objetos</button>
  </div>

  <h3>Andar</h3>
  <div class="linha">
    <button id="sobe">▲</button>
    <span id="andar" style="flex:2; text-align:center; line-height:26px">7</span>
    <button id="desce">▼</button>
  </div>

  <h3>Templo</h3>
  <button id="btTemplo">Marcar aqui</button>
  <div id="infoTemplo" style="color:var(--fraco); font-size:11px">—</div>

  <h3>Mapa</h3>
  <div id="infoMapa" style="color:var(--fraco); font-size:11px">0 casas</div>
</aside>

<footer>
  <span id="posicao">—</span>
  <span id="sel">—</span>
  <span id="recado" style="flex:1"></span>
</footer>

<script>
"use strict";
const TAM = 32;                       // tamanho da casa, igual ao do jogo
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

// O mapa e uma tabela esparsa: so guarda casa desenhada. Um mundo do Tibia tem
// milhoes de posicoes possiveis, entao matriz cheia nao cabe.
const estado = {
  casas: new Map(),                   // "x,y,z" -> {chao, itens[]}
  z: 7, camada: "chao", ferramenta: "pincel", pincel: 1, forma: "quadrado",
  sel: null, templo: null,
  camX: 1000, camY: 1000, zoom: 2,    // camera em coordenadas de casa
  miniatura: 96,                      // lado do tile na paleta, em pixel
  grade: true,
};
const historico = [], refazer = [];
const imagens = new Map();
let paleta = [];

const chave = (x, y, z) => `${x},${y},${z}`;
const recado = (t, tipo = "") => {
  const el = document.getElementById("recado");
  el.textContent = t; el.className = tipo;
};

/* ------------------------------------------------ paleta */
async function carregaPaleta() {
  paleta = await (await fetch("/paleta.json")).json();

  // A lista aparece ANTES das imagens: esperar as ~1000 decodificarem deixava
  // o editor mudo por segundos, com o seletor de categorias vazio.
  preencheCategorias();
  mostraPaleta();
  const primeiro = paleta.find(p => p.grupo === "chao");
  if (primeiro) escolhe(primeiro.id);

  let pendente = null;
  for (const p of paleta) {
    const im = new Image();
    // cada imagem que chega agenda um redesenho; o agendamento evita mil
    // redesenhos seguidos
    im.onload = () => {
      clearTimeout(pendente);
      pendente = setTimeout(desenha, 80);
    };
    im.src = `/paleta/${p.id}.png`;
    imagens.set(p.id, im);
  }
}

function preencheCategorias() {
  const sel = document.getElementById("categoria");
  const cats = [...new Set(paleta.map(p => p.categoria))].sort();
  for (const c of cats) {
    const o = document.createElement("option");
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  }
}

function mostraPaleta() {
  const amb = document.querySelector("#abas .ativo").dataset.amb;
  const cat = document.getElementById("categoria").value;
  const busca = document.getElementById("busca").value.trim().toLowerCase();
  const alvo = document.getElementById("pecas");
  alvo.innerHTML = "";
  let n = 0;
  const lista = [...paleta].sort((a, b) =>
    a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome));
  for (const p of lista) {
    // "ambos" aparece tanto em exterior quanto em interior: pedra e parede
    // servem nos dois, e escondê-las obrigaria a ficar trocando de aba
    if (amb !== "todos" && p.ambiente !== amb && p.ambiente !== "ambos") continue;
    if (cat && p.categoria !== cat) continue;
    if (busca && !p.nome.toLowerCase().includes(busca) && !String(p.id).includes(busca))
      continue;
    const d = document.createElement("div");
    d.className = "peca" + (estado.sel === p.id ? " sel" : "");
    d.title = `${p.nome} (id ${p.id}) · ${p.categoria}` +
              (p.usos ? ` · ${p.usos}x no mapa exemplo` : "");
    const lado = estado.miniatura;
    d.style.width = lado + "px";
    d.innerHTML = `<img src="/paleta/${p.id}.png" alt="" loading="lazy"` +
                  ` width="${lado}" height="${lado}"` +
                  ` style="width:${lado}px;height:${lado}px">` +
                  `<span style="width:${lado}px">${p.nome}</span>`;
    d.onclick = () => escolhe(p.id);
    d.onmouseenter = () => mostraPrevia(p, d);
    d.onmouseleave = escondePrevia;
    alvo.appendChild(d);
    n++;
  }
  if (!n) alvo.innerHTML = '<div style="grid-column:1/-1;color:#8b8f9a;' +
                           'padding:8px">nenhuma peça com esse filtro</div>';
}

function escolhe(id) {
  estado.sel = id;
  const p = paleta.find(q => q.id === id);
  document.getElementById("sel").textContent = p ? `${p.nome} (${id})` : "—";
  // peca de chao pinta na camada de chao; o resto vai para objetos
  if (p) trocaCamada(p.chao ? "chao" : "itens");
  mostraPaleta();
}

/* ------------------------------------------------ edicao */
function instantaneo() {
  historico.push(JSON.stringify([...estado.casas]));
  if (historico.length > 60) historico.shift();
  refazer.length = 0;
}
function aplica(texto) {
  estado.casas = new Map(JSON.parse(texto));
  desenha(); atualizaInfo();
}
function desfazer() {
  if (!historico.length) return;
  refazer.push(JSON.stringify([...estado.casas]));
  aplica(historico.pop());
}
function refaz() {
  if (!refazer.length) return;
  historico.push(JSON.stringify([...estado.casas]));
  aplica(refazer.pop());
}

function pinta(x, y) {
  const k = chave(x, y, estado.z);
  const casa = estado.casas.get(k) || { chao: 0, itens: [] };
  if (estado.ferramenta === "borracha") {
    if (estado.camada === "chao") { estado.casas.delete(k); return; }
    casa.itens = [];
  } else if (estado.camada === "chao") {
    casa.chao = estado.sel;
  } else {
    // objetos empilham, mas sem repetir o mesmo em cima de si
    if (casa.itens[casa.itens.length - 1] !== estado.sel) casa.itens.push(estado.sel);
  }
  if (!casa.chao && !casa.itens.length) estado.casas.delete(k);
  else estado.casas.set(k, casa);
}

function pincelada(x, y) {
  const n = estado.pincel;
  // Com tamanho par nao existe casa central. Ancorar no canto superior
  // esquerdo mantem o pincel previsivel: o cursor fica sempre na mesma
  // posicao relativa, em vez de pular meia casa a cada numero.
  const ini = -Math.floor((n - 1) / 2);
  const centro = ini + (n - 1) / 2;
  const raio = n / 2;
  for (let dy = ini; dy < ini + n; dy++) {
    for (let dx = ini; dx < ini + n; dx++) {
      if (estado.forma === "circulo") {
        // +0.5 mede do meio da casa: sem isso o circulo sai torto no par
        const ex = dx - centro, ey = dy - centro;
        // margem de 0.25: menos que isso o tamanho 2 nao pintava nada (as
        // quatro casas ficam a 0.71 do centro e o raio e 1), mais que isso o
        // circulo vira quadrado nos tamanhos impares
        if (Math.hypot(ex, ey) > raio - 0.25) continue;
      }
      pinta(x + dx, y + dy);
    }
  }
}

function balde(x, y) {
  // troca a regiao contigua que tem o mesmo chao da casa clicada
  const alvo = (estado.casas.get(chave(x, y, estado.z)) || {}).chao || 0;
  if (alvo === estado.sel) return;
  const fila = [[x, y]], visto = new Set();
  let conta = 0;
  while (fila.length && conta < 20000) {
    const [cx, cy] = fila.pop();
    const k = chave(cx, cy, estado.z);
    if (visto.has(k)) continue;
    visto.add(k);
    const atual = (estado.casas.get(k) || {}).chao || 0;
    if (atual !== alvo) continue;
    pinta(cx, cy); conta++;
    fila.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
  }
  recado(`balde: ${conta} casas`);
}

function contaGotas(x, y) {
  const casa = estado.casas.get(chave(x, y, estado.z));
  if (!casa) { recado("nada nesta casa"); return; }
  // na camada de objetos pega o de cima da pilha; senao, o chao
  const id = estado.camada === "itens" && casa.itens.length
    ? casa.itens[casa.itens.length - 1] : casa.chao;
  if (!id) { recado("nada nesta camada"); return; }
  escolhe(id);
  const p = paleta.find(q => q.id === id);
  recado("peça escolhida: " + (p ? p.nome : id), "ok");
}

/* ------------------------------------------------ desenho */
function ajustaTela() {
  const r = document.getElementById("tela").getBoundingClientRect();
  // janela ainda sem layout devolve 0: um canvas de tamanho zero nao desenha
  // nada e a tela fica preta sem explicacao
  cv.width = Math.max(1, Math.round(r.width) || innerWidth - 430);
  cv.height = Math.max(1, Math.round(r.height) || innerHeight - 70);
  desenha();
}

function casaNaTela(ev) {
  const r = cv.getBoundingClientRect();
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  const p = TAM * estado.zoom;
  return [Math.floor(estado.camX + (px - cv.width / 2) / p),
          Math.floor(estado.camY + (py - cv.height / 2) / p)];
}

function desenha() {
  const p = TAM * estado.zoom;
  ctx.fillStyle = "#0c0d10";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.imageSmoothingEnabled = false;

  const x0 = Math.floor(estado.camX - cv.width / 2 / p) - 1;
  const y0 = Math.floor(estado.camY - cv.height / 2 / p) - 1;
  const x1 = x0 + Math.ceil(cv.width / p) + 2;
  const y1 = y0 + Math.ceil(cv.height / p) + 2;

  const paraTela = (x, y) => [
    Math.round((x - estado.camX) * p + cv.width / 2),
    Math.round((y - estado.camY) * p + cv.height / 2)];

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const casa = estado.casas.get(chave(x, y, estado.z));
      if (!casa) continue;
      const [sx, sy] = paraTela(x, y);
      if (casa.chao) poe(casa.chao, sx, sy, p);
      for (const it of casa.itens) poe(it, sx, sy, p);
    }
  }

  if (estado.grade && estado.zoom >= 1) {
    ctx.strokeStyle = "rgba(255,255,255,.06)";
    ctx.beginPath();
    for (let x = x0; x <= x1; x++) {
      const [sx] = paraTela(x, 0);
      ctx.moveTo(sx + .5, 0); ctx.lineTo(sx + .5, cv.height);
    }
    for (let y = y0; y <= y1; y++) {
      const [, sy] = paraTela(0, y);
      ctx.moveTo(0, sy + .5); ctx.lineTo(cv.width, sy + .5);
    }
    ctx.stroke();
  }

  if (estado.templo && estado.templo[2] === estado.z) {
    const [sx, sy] = paraTela(estado.templo[0], estado.templo[1]);
    ctx.strokeStyle = "#e0b23a"; ctx.lineWidth = 2;
    ctx.strokeRect(sx + 1, sy + 1, p - 2, p - 2);
  }
}

function poe(id, sx, sy, p) {
  const im = imagens.get(id);
  if (!im || !im.complete || !im.naturalWidth) return;
  // sprite de 64 px cobre duas casas e ancora pelo canto inferior direito,
  // que e como o cliente do Tibia desenha objeto grande
  const larg = im.naturalWidth / TAM, alt = im.naturalHeight / TAM;
  ctx.drawImage(im, sx - (larg - 1) * p, sy - (alt - 1) * p, p * larg, p * alt);
}

function atualizaInfo() {
  const n = [...estado.casas.keys()].filter(k => k.endsWith(`,${estado.z}`)).length;
  document.getElementById("infoMapa").textContent =
    `${estado.casas.size} casas no total · ${n} neste andar`;
  document.getElementById("infoTemplo").textContent =
    estado.templo ? estado.templo.join(", ") : "—";
}

/* ------------------------------------------------ interacao */
let pintando = false, arrastando = false, ultimo = null;

cv.addEventListener("mousedown", ev => {
  // botao do meio ou Shift+arrastar move a camera
  if (ev.button === 1 || ev.shiftKey) {
    arrastando = true; ultimo = [ev.clientX, ev.clientY]; return;
  }
  // botao direito pega a peca que esta embaixo do cursor, como conta-gotas:
  // e o gesto mais usado ao modelar, e ir ate a paleta a cada troca cansa
  if (ev.button === 2) {
    const [px, py] = casaNaTela(ev);
    contaGotas(px, py);
    return;
  }
  const [x, y] = casaNaTela(ev);
  instantaneo();
  if (estado.ferramenta === "balde") balde(x, y);
  else if (estado.ferramenta === "conta") contaGotas(x, y);
  else { pintando = true; pincelada(x, y); }
  desenha(); atualizaInfo();
});

addEventListener("mousemove", ev => {
  if (arrastando) {
    const p = TAM * estado.zoom;
    estado.camX -= (ev.clientX - ultimo[0]) / p;
    estado.camY -= (ev.clientY - ultimo[1]) / p;
    ultimo = [ev.clientX, ev.clientY];
    desenha(); return;
  }
  const [x, y] = casaNaTela(ev);
  document.getElementById("posicao").textContent = `${x}, ${y}, ${estado.z}`;
  if (pintando) { pincelada(x, y); desenha(); }
});

addEventListener("mouseup", () => {
  if (pintando) atualizaInfo();
  pintando = arrastando = false;
});
cv.addEventListener("contextmenu", ev => ev.preventDefault());

cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  const antes = casaNaTela(ev);
  estado.zoom = Math.min(6, Math.max(0.5, estado.zoom * (ev.deltaY < 0 ? 1.2 : 1 / 1.2)));
  const depois = casaNaTela(ev);
  estado.camX += antes[0] - depois[0];      // mantem a casa sob o cursor
  estado.camY += antes[1] - depois[1];
  desenha();
}, { passive: false });

addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT") return;
  const k = ev.key.toLowerCase();
  if (ev.ctrlKey && k === "z") { ev.preventDefault(); desfazer(); }
  else if (ev.ctrlKey && (k === "y" || (k === "z" && ev.shiftKey))) { ev.preventDefault(); refaz(); }
  else if (ev.ctrlKey && k === "s") { ev.preventDefault(); salva(); }
  else if (k === "b") trocaFerramenta("pincel");
  else if (k === "g") trocaFerramenta("balde");
  else if (k === "e") trocaFerramenta("borracha");
  else if (k === "i") trocaFerramenta("conta");
  else if (k === "pageup") mudaAndar(-1);
  else if (k === "pagedown") mudaAndar(1);
});

function trocaFerramenta(f) {
  estado.ferramenta = f;
  document.querySelectorAll("[data-fer]").forEach(b =>
    b.classList.toggle("ativo", b.dataset.fer === f));
}
function trocaCamada(c) {
  estado.camada = c;
  document.querySelectorAll("[data-camada]").forEach(b =>
    b.classList.toggle("ativo", b.dataset.camada === c));
}
function mudaAndar(d) {
  estado.z = Math.min(15, Math.max(0, estado.z + d));
  document.getElementById("andar").textContent = estado.z;
  desenha(); atualizaInfo();
}

/* ------------------------------------------------ salvar */
async function salva() {
  const bt = document.getElementById("btSalvar");

  // Aviso antes de gravar: casa solta noutro andar quase sempre e clique sem
  // querer, e o jogador acabaria nascendo no vazio.
  const porAndar = {};
  for (const k of estado.casas.keys()) {
    const z = k.split(",")[2];
    porAndar[z] = (porAndar[z] || 0) + 1;
  }
  const andares = Object.entries(porAndar).sort((a, b) => b[1] - a[1]);
  if (andares.length > 1) {
    const soltos = andares.slice(1).map(([z, n]) => `${n} no andar ${z}`).join(", ");
    if (!confirm(`O andar ${andares[0][0]} tem ${andares[0][1]} casas, mas ha ` +
                 `${soltos}. Gravar assim mesmo?`)) {
      recado("nao gravei", "erro");
      return;
    }
  }

  bt.disabled = true; recado("salvando...");
  const projeto = {
    casas: Object.fromEntries(estado.casas),
    templo: estado.templo, cidade: "Vila do Destruitor",
    descricao: "Destruitor - mapa do editor",
  };
  try {
    const r = await fetch("/api/salvar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(projeto),
    });
    const d = await r.json();
    if (d.erro) recado("erro: " + d.erro, "erro");
    else recado(`${d.casas} casas gravadas` +
                (d.passos && d.passos.length ? " · " + d.passos.join(" · ") : ""), "ok");
  } catch (e) {
    recado("falhou: " + e.message, "erro");
  }
  bt.disabled = false;
}

/* ------------------------------------------------ ligacoes */
document.getElementById("btSalvar").onclick = salva;
document.getElementById("btDesfazer").onclick = desfazer;
document.getElementById("btRefazer").onclick = refaz;
document.getElementById("busca").oninput = mostraPaleta;
document.getElementById("verGrade").onchange = e => { estado.grade = e.target.checked; desenha(); };
document.getElementById("sobe").onclick = () => mudaAndar(-1);
document.getElementById("desce").onclick = () => mudaAndar(1);
document.getElementById("tamanho").oninput = e => {
  estado.pincel = +e.target.value;
  document.getElementById("vTam").textContent = estado.pincel;
};
document.getElementById("btTemplo").onclick = () => {
  estado.templo = [Math.round(estado.camX), Math.round(estado.camY), estado.z];
  atualizaInfo(); desenha();
  recado("templo em " + estado.templo.join(", "), "ok");
};
document.getElementById("btCentrar").onclick = () => {
  const chaves = [...estado.casas.keys()].map(k => k.split(",").map(Number));
  if (!chaves.length) return;
  estado.camX = Math.round(chaves.reduce((s, c) => s + c[0], 0) / chaves.length);
  estado.camY = Math.round(chaves.reduce((s, c) => s + c[1], 0) / chaves.length);
  desenha();
};
document.querySelectorAll("#abas button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#abas button").forEach(o => o.classList.remove("ativo"));
  b.classList.add("ativo"); mostraPaleta();
});
document.getElementById("categoria").onchange = mostraPaleta;
document.getElementById("zoomPaleta").oninput = e => {
  estado.miniatura = +e.target.value;
  mostraPaleta();                     // redesenha com o novo lado em pixel
};

const previa = document.getElementById("previa");
function mostraPrevia(p, alvo) {
  document.getElementById("previaImg").src = `/paleta/${p.id}.png`;
  document.getElementById("previaNome").textContent = `${p.nome} · ${p.categoria} · id ${p.id}`;
  const r = alvo.getBoundingClientRect();
  previa.style.display = "block";
  // encosta a previa na paleta, sem sair da tela por baixo
  previa.style.left = (r.right + 8) + "px";
  previa.style.top = Math.min(r.top, innerHeight - 280) + "px";
}
function escondePrevia() { previa.style.display = "none"; }
document.querySelectorAll("[data-fer]").forEach(b =>
  b.onclick = () => trocaFerramenta(b.dataset.fer));
document.querySelectorAll("[data-camada]").forEach(b =>
  b.onclick = () => trocaCamada(b.dataset.camada));
document.querySelectorAll("[data-forma]").forEach(b => b.onclick = () => {
  estado.forma = b.dataset.forma;
  document.querySelectorAll("[data-forma]").forEach(o =>
    o.classList.toggle("ativo", o === b));
});
addEventListener("resize", ajustaTela);

(async function inicia() {
  const est = await (await fetch("/api/estado")).json();
  const modo = document.getElementById("modo");
  if (est.publicar) {
    modo.textContent = "PUBLICA NA VPS";
    modo.style.background = "#2f5e22";
    modo.style.color = "#c8f0b0";
  } else {
    document.getElementById("btSalvar").textContent = "Salvar (só no PC)";
    modo.textContent = "SÓ LOCAL — não vai para a VPS";
    modo.style.background = "#5e4520";
    modo.style.color = "#f0d9b0";
  }
  const proj = await (await fetch("/api/projeto")).json();
  for (const [k, v] of Object.entries(proj.casas || {})) estado.casas.set(k, v);
  if (proj.templo) estado.templo = proj.templo;
  const chaves = [...estado.casas.keys()].map(k => k.split(",").map(Number));
  if (chaves.length) {
    estado.camX = Math.round(chaves.reduce((s, c) => s + c[0], 0) / chaves.length);
    estado.camY = Math.round(chaves.reduce((s, c) => s + c[1], 0) / chaves.length);
    estado.z = chaves[0][2];
    document.getElementById("andar").textContent = estado.z;
  }
  await carregaPaleta();
  ajustaTela(); atualizaInfo();
  recado(estado.casas.size ? "projeto carregado" : "mapa novo — escolha uma peça e pinte");
})();
</script>

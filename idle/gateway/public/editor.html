<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1117">
<meta name="robots" content="noindex">
<title>Editor da cidade · Destruitor</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- ?v= muda a cada publicacao (o navegador nao fica com a versao velha) -->
<link rel="stylesheet" href="editor.css?v=20261001a">
</head>
<body>
<div class="ed" id="ed">
  <header class="ed-top">
    <div class="ed-brand"><b>Editor da cidade</b><span>Thais · Destruitor Idle</span></div>
    <div class="ed-group" role="group" aria-label="Andar">
      <span class="ed-lbl">Andar</span>
      <div class="ed-floors" id="floors"></div>
    </div>
    <div class="ed-group">
      <label class="ed-chk"><input type="checkbox" id="optGrid"> Grade</label>
      <label class="ed-chk"><input type="checkbox" id="optZona" checked> Zona protegida</label>
      <label class="ed-chk"><input type="checkbox" id="optMud" checked> Mudanças</label>
      <label class="ed-chk"><input type="checkbox" id="optPontos" checked> Pontos</label>
      <label class="ed-chk"><input type="checkbox" id="optAnim" checked> Animação</label>
      <label class="ed-sel">Andares de cima
        <select id="optCima">
          <option value="jogo">como no jogo</option>
          <option value="sempre">sempre</option>
          <option value="transparente">transparentes</option>
          <option value="esconder">esconder</option>
        </select>
      </label>
    </div>
    <form class="ed-group ed-goto" id="goto" autocomplete="off">
      <input id="gotoIn" placeholder="ir para x, y" aria-label="Ir para a posição (x, y da cidade ou do mapa do Tibia)">
    </form>
    <div class="ed-group ed-actions">
      <button type="button" class="ed-btn" id="btnUndo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button type="button" class="ed-btn" id="btnRedo" title="Refazer (Ctrl+Y)" aria-label="Refazer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <button type="button" class="ed-btn" id="btnBaixar" title="Baixar uma cópia das edições (cidade_edicoes.json)">Baixar</button>
      <button type="button" class="ed-btn ed-save" id="btnSalvar" title="Publicar na cidade oficial do jogo (Ctrl+S)">Publicar na cidade</button>
    </div>
  </header>

  <aside class="ed-left">
    <section class="ed-box">
      <h2>Ferramentas</h2>
      <div class="ed-tools" id="tools"></div>
      <p class="ed-hint" id="toolHint"></p>
      <label class="ed-chk ed-opt" id="optPreencherWrap" hidden><input type="checkbox" id="optPreencher"> Pôr chão onde não tem</label>
    </section>
    <section class="ed-box ed-brush">
      <h2>Pincel</h2>
      <div class="ed-brushrow"><canvas id="brushIcon" width="44" height="44"></canvas><div id="brushTxt" class="ed-brushtxt">Nenhum item. Escolha na paleta ou use o conta-gotas.</div></div>
    </section>
    <section class="ed-box ed-palette">
      <h2>Paleta</h2>
      <input type="search" id="palBusca" placeholder="Buscar por nome ou id" aria-label="Buscar item por nome ou id">
      <div class="ed-cats" id="palCats" role="tablist"></div>
      <div class="ed-palinfo" id="palInfo"></div>
      <div class="ed-grid" id="palGrid"></div>
      <button type="button" class="ed-btn ed-more" id="palMais" hidden>Mostrar mais</button>
    </section>
  </aside>

  <main class="ed-map" id="mapWrap">
    <canvas id="mapa" aria-label="Mapa da cidade"></canvas>
    <div class="ed-banner" id="banner" hidden></div>
    <div class="ed-pub" id="pub" role="status" aria-live="polite" hidden></div>
  </main>

  <aside class="ed-right" id="painel"></aside>

  <footer class="ed-status">
    <span id="stPos">—</span>
    <span id="stItens" class="ed-stitems"></span>
    <span id="stEd" class="ed-sted"></span>
  </footer>
</div>

<div class="ed-overlay" id="overlay" hidden>
  <div class="ed-card" id="overlayCard"></div>
</div>
<div id="toast" class="ed-toast" role="status" aria-live="polite"></div>
<script src="editor.js?v=20261001a"></script>
</body>
</html>
